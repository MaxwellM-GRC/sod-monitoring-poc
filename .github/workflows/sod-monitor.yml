name: SoD Control Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1-5"

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run control and write evidence
        run: python -m src.main
      - name: Route individual findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_github_issues.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sod-control-evidence-${{ github.run_id }}
          path: output/
          retention-days: 90
      - name: Alert when findings remain
        run: python -c "import json,sys; d=json.load(open('output/control_evidence.json')); sys.exit(2 if d['findings'] else 0)"

