rules:
  SOD-01:
    severity: high
    assertion: The applied rule set matches the current approved SoD matrix.
  SOD-02:
    severity: critical
    assertion: No active user holds an unmitigated incompatible access combination.
  SOD-03:
    severity: high
    assertion: Cross application conflicts are included where the business process spans systems.
  SOD-04:
    severity: high
    assertion: Accepted conflicts have a current owner, approval, compensating control, and periodic reassessment.

rule_responses:
  SOD-01:
    remediation: Stop reliance on the run; obtain approval of the correct matrix version and rerun the complete population.
    mitigation: Compare changes between the applied and approved matrix and evaluate all users affected by the gap.
    root_cause: Determine whether matrix governance, deployment, version control, or approval evidence failed.
    closure_evidence: Approved matrix, version comparison, rerun evidence, and control owner approval.
    escalation: Escalate immediately when the wrong matrix could omit a financially significant conflict.
  SOD-02:
    remediation: Remove or redesign one side of the conflicting access, or obtain formal approval for a time bound compensating control.
    mitigation: Review relevant transactions during the exposure period and validate that an independent control detected or prevented inappropriate activity.
    root_cause: Determine whether role design, provisioning bypass, matrix mapping, system integration, or periodic review failed.
    closure_evidence: Entitlement evidence from before and after the change, an approved exception if applicable, the transaction lookback, and control owner approval.
    escalation: Escalate immediately for conflicts capable of creating and approving or releasing financial transactions without independent review.
  SOD-03:
    remediation: Add the missing cross application rule to the matrix through its formal approval process and rerun the complete population.
    mitigation: Manually evaluate the affected process and application populations until automated coverage is restored.
    root_cause: Determine why process risk analysis, application inventory, or matrix maintenance omitted the combination across systems.
    closure_evidence: Approved matrix revision, coverage reconciliation, rerun evidence, and control owner approval.
    escalation: Escalate when the missing rule affects a financially significant process or privileged access.
  SOD-04:
    remediation: Remove conflicting access or renew and approve the exception with an owned, effective compensating control and reassessment date.
    mitigation: Perform the overdue or failed compensating control review and a transaction lookback for the unsupported period.
    root_cause: Determine why exception ownership, expiry monitoring, evidence collection, or control performance failed.
    closure_evidence: Current approval, owner, compensating control test, reassessment date, lookback conclusion, and control owner approval.
    escalation: Escalate immediately when a critical conflict has no effective compensating control; otherwise at the response SLA.

response_governance:
  mode: human_approval_required
  response_sla_days: 5
  escalation_owner: Financial Systems Controls
  prohibited_actions:
    - automatic_access_removal
    - automatic_risk_acceptance
    - automatic_exception_closure
