control:
  id: ITGC-SOD-001
  name: Segregation of Duties Monitoring
  source_checklist: SOX_Segregation_of_Duties_Checklist.docx
  risk_category: logical_access
  risk: >-
    Failure to identify and resolve incompatible access combinations could
    allow a user to initiate and conceal an error or fraud without independent
    review, resulting in unauthorized or inaccurate financial transactions.
  control_description: >-
    Management performs periodic analysis of complete active user entitlement
    populations against the approved segregation of duties matrix and
    remediates or formally mitigates identified conflicts.
  objective: >-
    Incompatible duties within and across in scope systems are identified,
    prevented, remediated, or mitigated through approved compensating controls.
  activity: >-
    Evaluate complete active user entitlement populations against the approved,
    versioned SoD rule matrix, including cross application combinations.
  frequency: Weekly detective monitoring; formal management review at least quarterly
  population: >-
    All active human, privileged, generic, and applicable service accounts with
    roles and permissions across in scope systems.
  owner: Financial Systems Controls

review:
  as_of: "2026-09-15"
  window_start: "2026-09-01T00:00:00Z"
  window_end: "2026-09-15T23:59:59Z"
  approved_matrix_version: "2026.1"
  compensating_control_test_max_age_days: 92

